name: Build FFExternal

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos dependencies
        run: |
          brew install ldid xz

      - name: Setup Theos
        uses: actions/cache@v4
        id: theos-cache
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Clone Theos (if not cached)
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git theos
          git -C theos submodule update --init --recursive

      - name: Download iOS SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: theos/sdks
          key: ios-sdk-16.5

      - name: Fetch iOS 16.5 SDK (if not cached)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Set THEOS env
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          make package FINALPACKAGE=1 DEBUG=0 -j$(sysctl -n hw.logicalcpu)

      - name: Upload .tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal
          path: packages/*.tipa
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
