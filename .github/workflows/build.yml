name: Extract ZIP to Root

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP to repository root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/project_extract
          unzip -oq "$ZIP_FILE" -d /tmp/project_extract

          SOURCE_DIR="/tmp/project_extract"

          if [ "$(find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -type d)" ]; then
            SOURCE_DIR="$(find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -type d)"
          fi

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ZIP_FILE"
          rm -rf /tmp/project_extract

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Extract project ZIP to repository root"
          git push
